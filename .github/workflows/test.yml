name: Tests
on:
  push:
    branches: [ 'main', 'next' ]
  pull_request:
    branches: [ 'main', 'next' ]

permissions:
  contents: read

jobs:
  test-web:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install frontend dependencies
      run: yarn install --frozen-lockfile --non-interactive
    - name: Test browser and desktop frontend behavior
      run: yarn test --watchAll=false --runInBand
      env:
        CI: true
    - name: Check TypeScript
      run: yarn tsc --noEmit
    - name: Package self-contained web frontend
      run: yarn package:web
      env:
        CI: true
    - uses: actions/upload-artifact@v4
      with:
        name: hailstorm-web
        path: |
          artifacts/hailstorm-web-*.tar.gz
          artifacts/hailstorm-web-*.tar.gz.sha256
        if-no-files-found: error

  test-tauri:
    needs: test-web
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    env:
     CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
    - uses: actions/checkout@v4
    - name: setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: install Rust stable
      uses: dtolnay/rust-toolchain@stable
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        version: '25.3'
    - name: install dependencies (ubuntu only)
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
    - name: install app dependencies and build it
      run: yarn install --frozen-lockfile --non-interactive && yarn build
    - name: test desktop agent
      run: cargo test --locked --manifest-path src-tauri/Cargo.toml
