name: Publish
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Check release version matches the app
      run: node -e 'if (require("./package.json").version !== process.env.GITHUB_REF_NAME) throw new Error("Tag must match package.json version")'
    - name: Install frontend dependencies
      run: yarn install --frozen-lockfile --non-interactive
    - name: Test frontend
      run: yarn test --watchAll=false --runInBand
      env:
        CI: true
    - name: Package web frontend
      run: yarn package:web "$GITHUB_REF_NAME"
      env:
        CI: true
    - uses: actions/upload-artifact@v4
      with:
        name: hailstorm-web
        path: artifacts/hailstorm-web-*
        if-no-files-found: error

  publish-tauri:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}
    env:
     CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
    - uses: actions/checkout@v4
    - name: Read changelog
      id: changelog
      uses: juliangruber/read-file-action@v1
      with:
        path: ./CHANGELOG.md
    - name: setup node
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: install Rust stable
      uses: dtolnay/rust-toolchain@stable
    - name: Install Protoc
      uses: arduino/setup-protoc@v3
      with:
        version: '25.3'
    - name: install dependencies (ubuntu only)
      if: matrix.platform == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf
    - name: install app dependencies and build it
      run: yarn install --frozen-lockfile --non-interactive && yarn build
    - uses: tauri-apps/tauri-action@v0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version
        releaseName: "App v__VERSION__"
        releaseBody: '${{ steps.changelog.outputs.content }}'
        releaseDraft: true
        prerelease: false

  publish-web:
    needs: [build-web, publish-tauri]
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: hailstorm-web
        path: artifacts
    - name: Attach web frontend to the desktop draft release
      run: gh release upload "app-v$GITHUB_REF_NAME" artifacts/hailstorm-web-* --repo "$GITHUB_REPOSITORY"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
